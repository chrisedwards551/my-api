services:
  postgres:
    image: postgres:18
    container_name: postgres-compose-test
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-compose-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend-python
    container_name: fastapi-compose-test
    env_file:
      - ./backend-python/.env
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  express:
    build:
      context: ./backend-node
    container_name: express-compose-test
    env_file:
      - ./backend-node/.env
    ports:
      - "3001:3000"
    depends_on:
      - fastapi

  nginx:
    image: nginx:alpine
    container_name: nginx-compose-test
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - express

volumes:
  postgres-compose-data: