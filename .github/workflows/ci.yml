name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify-python:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./test.db"
      SECRET_KEY: "ci-test-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CI_TEST_SECRET: ${{ secrets.CI_TEST_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-python/requirements.txt

      - name: Verify CI secret is available
        run: |
          if [ -n "$CI_TEST_SECRET" ]; then
            echo "CI_TEST_SECRET is available."
          else
            echo "CI_TEST_SECRET is missing."
            exit 1
          fi

      - name: Run Python tests
        working-directory: backend-python
        run: |
          pytest

  verify-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node.js dependencies
        working-directory: backend-node
        run: |
          npm ci

      - name: Run Node.js tests
        working-directory: backend-node
        run: |
          npm test

  lint-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: |
          python -m pip install ruff==0.16.5

      - name: Run Ruff
        run: |
          ruff check backend-python

  lint-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node.js dependencies
        working-directory: backend-node
        run: |
          npm ci

      - name: Run ESLint
        working-directory: backend-node
        run: |
          npm run lint

  docker-build-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/my-api-python:latest ./backend-python

      - name: Push Python Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/my-api-python:latest

  docker-build-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Node.js Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/my-api-node:latest ./backend-node

      - name: Push Node.js Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/my-api-node:latest